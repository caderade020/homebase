<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="apple-touch-icon" href="clock-icon.png">
<title>Home Base Clock</title>
<!--
  Written for old Safari (iOS 9 on the first iPad mini): plain JavaScript,
  flexbox with -webkit- prefixes, system fonts, no outside libraries.
-->
<style>
html, body { margin: 0; height: 100%; background: #0b1220; color: #e9eef5; overflow: hidden; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
.app {
  height: 100%; box-sizing: border-box; padding: 28px 34px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-flex-direction: row; flex-direction: row;
  -webkit-transition: -webkit-transform 3s ease; transition: transform 3s ease;
}
.time-side {
  -webkit-flex: 1 1 0; flex: 1 1 0; min-width: 0;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
  -webkit-justify-content: center; justify-content: center;
  padding-right: 34px; border-right: 1px solid #22304a;
}
.cal-side {
  -webkit-flex: 1.15 1 0; flex: 1.15 1 0; min-width: 0; padding-left: 34px;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
}
.clock { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; line-height: .9; }
.hm { font-size: 150px; font-weight: 100; letter-spacing: -4px; }
.side { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; margin: 14px 0 0 10px; font-size: 26px; font-weight: 300; }
.side .sec { color: #7e8ba0; margin-top: 6px; }
.date { font-size: 34px; font-weight: 300; margin-top: 18px; }
.year { font-size: 20px; color: #7e8ba0; margin-top: 6px; font-weight: 300; }

#agenda { -webkit-flex: 1 1 auto; flex: 1 1 auto; overflow: hidden; }
.day { margin-bottom: 18px; }
.day-h { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; border-bottom: 1px solid #22304a; padding: 4px 0 8px; margin-bottom: 6px; }
.day-h b { font-size: 24px; font-weight: 500; }
.day-h span { font-size: 16px; color: #7e8ba0; margin-left: 10px; }
.ev { display: -webkit-flex; display: flex; padding: 9px 10px 9px 12px; border-left: 4px solid #4a86d8; margin-bottom: 4px; border-radius: 0 8px 8px 0; }
.ev.past { opacity: .4; }
.ev.now { background: #1c2b45; }
.ev .t { width: 108px; -webkit-flex: none; flex: none; color: #9fb0c6; font-size: 17px; padding-top: 1px; }
.ev .b { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
.ev .ti { font-size: 20px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .lo { font-size: 15px; color: #7e8ba0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.ev .nowtag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #0b1220; background: #ffd34d; border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: 3px; }
.empty { color: #7e8ba0; font-size: 18px; padding: 8px 0 4px; }
.more { color: #7e8ba0; font-size: 16px; padding: 4px 0 0 16px; }
.status { -webkit-flex: none; flex: none; font-size: 14px; color: #5f6d84; padding-top: 8px; }
.status.warn { color: #e0a34a; }

.gear { position: absolute; right: 14px; bottom: 12px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #33415a; font-size: 26px; line-height: 44px; text-align: center; padding: 0; }

.dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; -webkit-transition: opacity 2s; transition: opacity 2s; }
.dim.on { opacity: .78; pointer-events: auto; }

.setup { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #0b1220; overflow: auto; -webkit-overflow-scrolling: touch; display: none; }
.setup.on { display: block; }
.setup-in { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
.setup h1 { font-weight: 300; font-size: 34px; margin: 0 0 6px; }
.setup p { color: #9fb0c6; font-size: 16px; line-height: 1.45; margin: 0 0 18px; }
.setup label { display: block; font-size: 15px; font-weight: 500; margin: 16px 0 6px; }
.setup input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px; border-radius: 8px; border: 1px solid #2b3a55; background: #121c2f; color: #e9eef5; -webkit-appearance: none; }
.setup .row { display: -webkit-flex; display: flex; }
.setup .row > div { -webkit-flex: 1; flex: 1; }
.setup .row > div + div { margin-left: 12px; }
.setup .btns { margin-top: 26px; display: -webkit-flex; display: flex; }
.setup button { font-size: 18px; padding: 13px 22px; border-radius: 10px; border: 0; background: #4a86d8; color: #fff; -webkit-appearance: none; }
.setup button.ghost { background: transparent; border: 1px solid #2b3a55; color: #e9eef5; margin-left: 12px; }
.setup .msg { color: #e0a34a; margin-top: 14px; font-size: 15px; }

@media (orientation: portrait) {
  .app { -webkit-flex-direction: column; flex-direction: column; padding: 34px 30px; }
  .time-side { -webkit-flex: none; flex: none; padding: 10px 0 26px; border-right: 0; border-bottom: 1px solid #22304a; }
  .cal-side { padding: 22px 0 0; }
  .hm { font-size: 170px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="time-side">
    <div class="clock"><span class="hm" id="hm">--:--</span><span class="side"><span id="ampm"></span><span class="sec" id="sec"></span></span></div>
    <div class="date" id="date"></div>
    <div class="year" id="year"></div>
  </section>
  <section class="cal-side">
    <div id="agenda"></div>
    <div class="status" id="status"></div>
  </section>
</div>
<button class="gear" id="gear" aria-label="Settings">&#9881;</button>
<div class="dim" id="dim"></div>

<div class="setup" id="setup">
  <div class="setup-in">
    <h1>Clock settings</h1>
    <p>Enter the code you put in your Google calendar helper (and its web app address, if it isn’t built in). After saving, tap Share and then Add to Home Screen so the clock opens full screen with these settings.</p>
    <label for="inUrl" id="inUrlLabel">Calendar helper address</label>
    <input id="inUrl" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="inToken">Code</label>
    <input id="inToken" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <div><label for="inNs">Dim at night from</label><input id="inNs" type="time"></div>
      <div><label for="inNe">until</label><input id="inNe" type="time"></div>
    </div>
    <div class="btns"><button id="save">Save</button><button class="ghost" id="cancel">Cancel</button></div>
    <div class="msg" id="setupMsg"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== PASTE YOUR CALENDAR HELPER ADDRESS HERE (the Web app URL ending in /exec) =====
     Putting it here means the iPad only needs the short page address and your code. */
  var BUILT_IN_HELPER = "https://script.google.com/macros/s/AKfycbzt2h2Lp14Z7GjWvCZWe0ZdmP8HQiUyGqvnn8e_B27Mn475VzgCoJ2Yo7rBy6giw5GZ/exec";

  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var STORE = "hbclock.v1";

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function fmtTime(d) { var h = d.getHours(); return (h % 12 || 12) + ":" + pad(d.getMinutes()) + " " + (h < 12 ? "AM" : "PM"); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function load() { try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; } }
  function store(o) { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} }

  /* ---------- Settings: from the address (so Add to Home Screen keeps them), else saved ---------- */
  function readParams() {
    var out = {}, q = location.search.replace(/^\?/, "").split("&");
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split("=");
      if (kv[0]) out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    }
    return out;
  }
  var saved = load();
  var params = readParams();
  var cfg = {
    url: params.u || saved.url || BUILT_IN_HELPER,
    token: params.t || saved.token || "",
    nightStart: params.ns || saved.nightStart || "22:00",
    nightEnd: params.ne || saved.nightEnd || "06:30"
  };
  saved.url = cfg.url; saved.token = cfg.token; saved.nightStart = cfg.nightStart; saved.nightEnd = cfg.nightEnd;
  store(saved);

  /* ---------- Clock ---------- */
  function tick() {
    var d = new Date(), h = d.getHours();
    $("hm").textContent = (h % 12 || 12) + ":" + pad(d.getMinutes());
    $("ampm").textContent = h < 12 ? "AM" : "PM";
    $("sec").textContent = pad(d.getSeconds());
    $("date").textContent = DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
    $("year").textContent = String(d.getFullYear());
    if (d.getSeconds() === 0) { renderAgenda(); updateDim(); }
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }

  /* ---------- Calendar (JSONP, which old Safari handles without trouble) ---------- */
  var events = saved.events || null;
  var lastOk = saved.lastOk || 0;
  var lastError = "";
  var cbN = 0;

  function jsonp(url, ok, fail) {
    var name = "hbcb" + (++cbN) + "_" + Date.now(), done = false;
    var s = document.createElement("script");
    var timer = setTimeout(function () { finish(); fail("timeout"); }, 25000);
    function finish() {
      if (done) return false;
      done = true; clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      return true;
    }
    window[name] = function (data) { if (finish()) ok(data); };
    s.onerror = function () { if (finish()) fail("network"); };
    s.src = url + (url.indexOf("?") < 0 ? "?" : "&") + "callback=" + name +
      "&token=" + encodeURIComponent(cfg.token) + "&_=" + Date.now();
    document.body.appendChild(s);
  }

  function loadCalendar() {
    if (!cfg.url || !cfg.token) { lastError = "setup"; renderAgenda(); return; }
    jsonp(cfg.url, function (data) {
      if (data && data.ok) {
        events = data.events || [];
        lastOk = Date.now(); lastError = "";
        saved.events = events; saved.lastOk = lastOk; store(saved);
      } else {
        lastError = data && data.error === "token" ? "token" : "calendar";
      }
      renderAgenda();
    }, function () { lastError = "network"; renderAgenda(); });
  }

  function eventsForDay(day) {
    var start = new Date(day.getFullYear(), day.getMonth(), day.getDate()).getTime();
    var end = start + 24 * 3600 * 1000 + 3600 * 1000; // allow for daylight-saving days
    var nextMidnight = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1).getTime();
    var out = [];
    for (var i = 0; i < (events || []).length; i++) {
      var e = events[i];
      if (e.allDay) { if (e.start < nextMidnight && e.end > start) out.push(e); }
      else if (e.start >= start && e.start < nextMidnight) out.push(e);
    }
    return out;
  }

  function eventRow(e, now) {
    var row = el("div", "ev");
    if (e.color) row.style.borderLeftColor = e.color;
    var isNow = !e.allDay && e.start <= now && e.end > now;
    var isPast = !e.allDay && e.end <= now;
    if (isNow) row.className += " now";
    if (isPast) row.className += " past";
    row.appendChild(el("div", "t", e.allDay ? "All day" : fmtTime(new Date(e.start))));
    var b = el("div", "b");
    var ti = el("div", "ti", e.title);
    if (isNow) ti.appendChild(el("span", "nowtag", "NOW"));
    b.appendChild(ti);
    if (e.location) b.appendChild(el("div", "lo", e.location));
    row.appendChild(b);
    row.setAttribute("data-past", isPast ? "1" : "0");
    return row;
  }

  function renderAgenda() {
    var box = $("agenda"), status = $("status");
    while (box.firstChild) box.removeChild(box.firstChild);
    var now = Date.now(), today = new Date(), tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);

    if (!events) {
      box.appendChild(el("div", "empty", lastError === "setup" ? "Tap the gear in the corner to connect your calendar." : "Loading your calendar…"));
    } else {
      var days = [[today, "Today"], [tomorrow, "Tomorrow"]];
      for (var i = 0; i < days.length; i++) {
        var d = days[i][0], sec = el("div", "day"), h = el("div", "day-h");
        h.appendChild(el("b", null, days[i][1]));
        h.appendChild(el("span", null, DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate()));
        sec.appendChild(h);
        var list = eventsForDay(d);
        if (!list.length) sec.appendChild(el("div", "empty", "Nothing scheduled"));
        for (var j = 0; j < list.length; j++) sec.appendChild(eventRow(list[j], now));
        box.appendChild(sec);
      }
      fitAgenda(box);
    }

    var text = "", warn = false;
    if (lastError === "token") { text = "The code doesn’t match your calendar helper. Check settings."; warn = true; }
    else if (lastError === "network" || lastError === "calendar") {
      text = lastOk ? "Couldn’t reach your calendar. Showing what loaded at " + fmtTime(new Date(lastOk)) + "." : "Couldn’t reach your calendar yet. Trying again in a few minutes.";
      warn = true;
    } else if (lastOk) text = "Calendar updated " + fmtTime(new Date(lastOk));
    status.textContent = text;
    status.className = "status" + (warn ? " warn" : "");
  }

  // If everything doesn't fit, hide finished events first, then trim the end with "+N more".
  function fitAgenda(box) {
    if (box.scrollHeight <= box.clientHeight) return;
    var past = box.querySelectorAll('.ev[data-past="1"]');
    for (var i = 0; i < past.length && box.scrollHeight > box.clientHeight; i++) past[i].parentNode.removeChild(past[i]);
    var sections = box.querySelectorAll(".day");
    for (var s = sections.length - 1; s >= 0 && box.scrollHeight > box.clientHeight; s--) {
      var rows = sections[s].querySelectorAll(".ev"), hidden = 0, more = null;
      for (var r = rows.length - 1; r > 0 && box.scrollHeight > box.clientHeight; r--) {
        rows[r].parentNode.removeChild(rows[r]); hidden++;
        if (!more) { more = el("div", "more"); sections[s].appendChild(more); }
        more.textContent = "+" + hidden + " more";
      }
    }
  }

  /* ---------- Night dimming and burn-in protection ---------- */
  var wakeUntil = 0;
  function mins(t) { var p = String(t || "0:0").split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
  function isNight() {
    var d = new Date(), m = d.getHours() * 60 + d.getMinutes(), a = mins(cfg.nightStart), b = mins(cfg.nightEnd);
    if (a === b) return false;
    return a < b ? (m >= a && m < b) : (m >= a || m < b);
  }
  function updateDim() {
    var on = isNight() && Date.now() > wakeUntil && !$("setup").className.match(/\bon\b/);
    $("dim").className = "dim" + (on ? " on" : "");
  }
  $("dim").addEventListener("click", function () { wakeUntil = Date.now() + 2 * 60 * 1000; updateDim(); });

  var shifts = [[0, 0], [4, 0], [4, 4], [0, 4], [-4, 4], [-4, 0], [-4, -4], [0, -4], [4, -4]], si = 0;
  function shift() {
    si = (si + 1) % shifts.length;
    var t = "translate(" + shifts[si][0] + "px," + shifts[si][1] + "px)";
    $("app").style.webkitTransform = t; $("app").style.transform = t;
  }

  /* ---------- Settings screen ---------- */
  function openSetup() {
    var builtIn = BUILT_IN_HELPER && cfg.url === BUILT_IN_HELPER;
    $("inUrl").style.display = builtIn ? "none" : "";
    $("inUrlLabel").style.display = builtIn ? "none" : "";
    $("inUrl").value = builtIn ? "" : cfg.url; $("inToken").value = cfg.token;
    $("inNs").value = cfg.nightStart; $("inNe").value = cfg.nightEnd;
    $("setupMsg").textContent = "";
    $("setup").className = "setup on"; updateDim();
  }
  function closeSetup() { $("setup").className = "setup"; updateDim(); }
  $("gear").addEventListener("click", openSetup);
  $("cancel").addEventListener("click", closeSetup);
  $("save").addEventListener("click", function () {
    var u = $("inUrl").value.replace(/^\s+|\s+$/g, ""), t = $("inToken").value.replace(/^\s+|\s+$/g, "");
    if (!u && BUILT_IN_HELPER) u = BUILT_IN_HELPER;
    if (!/^https:\/\//.test(u)) { $("setupMsg").textContent = "The address should start with https://"; return; }
    if (!t) { $("setupMsg").textContent = "Enter the code from your calendar helper."; return; }
    var ns = $("inNs").value || "22:00", ne = $("inNe").value || "06:30";
    saved.url = u; saved.token = t; saved.nightStart = ns; saved.nightEnd = ne; saved.events = null; saved.lastOk = 0;
    store(saved);
    // Put the settings in the address so Add to Home Screen remembers them.
    var q = "?" + (u !== BUILT_IN_HELPER ? "u=" + encodeURIComponent(u) + "&" : "") + "t=" + encodeURIComponent(t) + "&ns=" + encodeURIComponent(ns) + "&ne=" + encodeURIComponent(ne);
    location.replace(location.pathname + q);
  });

  /* ---------- Start ---------- */
  tick();
  renderAgenda();
  loadCalendar();
  setInterval(loadCalendar, 5 * 60 * 1000);
  setInterval(shift, 3 * 60 * 1000);
  window.addEventListener("orientationchange", function () { setTimeout(renderAgenda, 400); });
  // Reload once a night at 3 AM so the old iPad stays fresh.
  (function () {
    var n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 3, 0, 0);
    if (t <= n) t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 3, 0, 0);
    setTimeout(function () { location.reload(); }, t - n);
  })();
  if (!cfg.url || !cfg.token) openSetup();
})();
</script>
</body>
</html>
